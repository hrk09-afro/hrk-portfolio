<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haruka Miura - Contact</title>
    <link rel="stylesheet" href="common.css?v=1.0">
    <link rel="stylesheet" href="contact_layout.css?v=1.0">
</head>
<body>
     
    <header class="m-header">
        <div class="header-content">
            <h1 class="site-title"><a href="index.html">Haruka Miura</a></h1>
            <nav class="m-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about_index.html">About</a></li>
                    <li><a href="work_index.html">Work</a></li>
                    <li><a href="contact_index.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="m-content">
       <section id="contact" class="contact-section">
            <div class="section-header">
                <h2>Contact <span class="jp-title">お問い合わせ</span></h2>
            </div>
            <div class="contact-form-container">
                <form class="contact-form">
                    <div class="form-group">
                        <label for="name">お名前</label>
                        <input type="text" id="name" name="name" placeholder="山田 太郎" required>
                    </div>
                    <div class="form-group">
                        <label for="company">会社名</label>
                        <input type="text" id="company" name="company" placeholder="株式会社〇〇（任意）">
                    </div>
                    <div class="form-group">
                        <label for="email">メールアドレス</label>
                        <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">ご用件について</label>
                        <input type="text" id="subject" name="subject" placeholder="制作のご依頼について">
                    </div>
                    <div class="form-group">
                        <label for="message">お問い合わせ内容</label>
                        <textarea id="message" name="message" rows="8" placeholder="お問い合わせ内容をご記入ください" required></textarea>
                    </div>
                    <button type="submit" class="submit-button">送信</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="m-footer">
        <div class="footer-inner">
            <div class="social-follow-section">
                <p>Follow Me</p>
                <div class="social-icons">
                    <span>Twitter</span><span>Instagram</span>
                </div>
            </div>
            <div class="footer-info-section">
                <p class="name">Haruka Miura</p>
                <p class="role">Design Student</p>
                <nav class="footer-nav">
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="about_index.html">About</a></li>
                        <li><a href="work_index.html">Work</a></li>
                        <li><a href="contact_index.html">Contact</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </footer>
    <script src="js/scroll_reveal.js"></script> 
</body>
</html>
